version: '3.8'
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: zsalon
      POSTGRES_PASSWORD: zsalonpass
      POSTGRES_DB: zsalondb
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql
    command: postgres -c 'max_connections=200'

volumes:
  db-data: